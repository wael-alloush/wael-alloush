name: generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - snake.svg

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: wael-alloush
          outputs: "snake.svg?color_snake=#e3b341&color_dots=#1e564c,#2a7a62,#3d9a74,#c4a035,#e3b341&color_background=#0d3b34"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: commit snake svg
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update contribution snake
          file_pattern: snake.svg
